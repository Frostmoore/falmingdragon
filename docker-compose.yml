services:

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: fd_nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - storage_logs:/var/www/storage/logs
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ── PHP-FPM app ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fd_app
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    volumes:
      - ./.env:/var/www/.env:ro
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
      - bootstrap_cache:/var/www/bootstrap/cache
      - skills_data:/var/www/skills
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Queue worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fd_worker
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300", "--sleep=3", "--max-jobs=500"]
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - QUEUE_CONNECTION=database
    volumes:
      - ./.env:/var/www/.env:ro
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
      - skills_data:/var/www/skills
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ── MariaDB ───────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: fd_db
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-flamingdragon_root}"
      MARIADB_DATABASE:      "${DB_DATABASE:-flamingdragon}"
      MARIADB_USER:          "${DB_USERNAME:-flamingdragon}"
      MARIADB_PASSWORD:      "${DB_PASSWORD:-flamingdragon_secret}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  storage_app:
  storage_logs:
  storage_framework:
  bootstrap_cache:
  skills_data:
